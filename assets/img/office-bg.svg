    <path d="M-70 -40C-70 -120 -60 -170 -48 -190H48C60 -170 70 -120 70 -40Z" fill="#1976D2"/><path d="M-70 -40C-70 -120 -60 -170 -48 -190H0V-40Z" fill="#fff" opacity=".1"/>
