    </g>
    <g id="vine">
      <path d="M0 0C-6 60 8 110 -2 170C-8 210 4 240 0 280" fill="none" stroke="#3C6630" stroke-width="4" stroke-linecap="round"/>
      <g fill="#5C8C42"><ellipse cx="-14" cy="40" rx="14" ry="8" transform="rotate(-30 -14 40)"/><ellipse cx="12" cy="70" rx="14" ry="8" transform="rotate(30 12 70)"/><ellipse cx="-14" cy="108" rx="14" ry="8" transform="rotate(-30 -14 108)"/><ellipse cx="12" cy="140" rx="14" ry="8" transform="rotate(30 12 140)"/><ellipse cx="-14" cy="176" rx="14" ry="8" transform="rotate(-30 -14 176)"/><ellipse cx="12" cy="208" rx="14" ry="8" transform="rotate(30 12 208)"/><ellipse cx="-12" cy="244" rx="13" ry="7" transform="rotate(-30 -12 244)"/><ellipse cx="10" cy="270" rx="12" ry="7" transform="rotate(30 10 270)"/></g>
      <g fill="#4E7D3A"><ellipse cx="14" cy="22" rx="12" ry="7" transform="rotate(25 14 22)"/><ellipse cx="-12" cy="88" rx="12" ry="7" transform="rotate(-25 -12 88)"/><ellipse cx="14" cy="124" rx="12" ry="7" transform="rotate(25 14 124)"/><ellipse cx="-12" cy="158" rx="12" ry="7" transform="rotate(-25 -12 158)"/><ellipse cx="14" cy="190" rx="12" ry="7" transform="rotate(25 14 190)"/></g>
    </g>
