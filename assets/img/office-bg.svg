<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1E8DA"/><stop offset="1" stop-color="#E0CFB8"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9D0F5"/><stop offset="1" stop-color="#E4F1FC"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B8824F"/><stop offset="1" stop-color="#8F5A27"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1976D2"/><stop offset="1" stop-color="#0F4C8F"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9B8" stop-opacity=".9"/><stop offset="1" stop-color="#FFE9B8" stop-opacity="0"/></radialGradient>
    <path id="leaf" d="M0 0C16-26 16-62 0-92C-16-62-16-26 0 0Z"/>
    <path id="leaf-s" d="M0 0C10-16 10-38 0-56C-10-38-10-16 0 0Z"/>
    <g id="fan">
      <use href="#leaf" fill="#4E7D3A" transform="rotate(-62)"/><use href="#leaf" fill="#6A9A4A" transform="rotate(-38) scale(1.1)"/>
      <use href="#leaf" fill="#3C6630" transform="rotate(-14) scale(1.2)"/><use href="#leaf" fill="#5C8C42" transform="rotate(12) scale(1.15)"/>
      <use href="#leaf" fill="#4E7D3A" transform="rotate(36) scale(1.05)"/><use href="#leaf" fill="#6A9A4A" transform="rotate(60)"/>
    </g>
    <g id="fan-s">
      <use href="#leaf-s" fill="#5C8C42" transform="rotate(-50)"/><use href="#leaf-s" fill="#3C6630" transform="rotate(-20) scale(1.15)"/>
