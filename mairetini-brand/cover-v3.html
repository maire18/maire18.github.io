<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mairetini Facebook Cover (design 3, minimal)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0a3256; --mid:#1d6fc4; --olive:#7d8a14; --muted:#5b7085; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1640px; height:624px; overflow:hidden; background:#fff; }
  .cover { position:relative; width:1640px; height:624px; background:#fff; font-family:"Poppins","Segoe UI",Arial,sans-serif; color:var(--navy); }

  .text { position:absolute; left:120px; top:50%; transform:translateY(-58%); }
  .brand { font-size:118px; font-weight:700; letter-spacing:8px; line-height:1; color:var(--navy); }
  .rule { width:64px; height:4px; margin:30px 0 24px; border-radius:2px; background:var(--olive); }
  .sub { font-size:22px; font-weight:600; letter-spacing:4px; color:var(--mid); }
  .tag { margin-top:16px; font-size:24px; font-weight:500; line-height:1.45; color:var(--muted); }
  .tag b { color:var(--olive); font-weight:600; }

  .logo { position:absolute; right:150px; top:50%; width:300px; height:300px; transform:translateY(-62%); border-radius:50%; }
  .web { position:absolute; right:150px; top:calc(50% + 120px); width:300px; text-align:center; font-size:18px; font-weight:500; letter-spacing:.5px; color:var(--muted); }
</style>
</head>
<body>
<div class="cover">
  <div class="text">
    <div class="brand">MAIRETINI</div>
    <div class="rule"></div>
    <div class="sub">WEBSITE DEVELOPMENT &middot; CAREER PORTFOLIOS</div>
    <div class="tag">More visibility online. More inquiries. <b>More customers.</b></div>
  </div>
  <img class="logo" src="mairetini-logo-circle.png" alt="">
  <div class="web">mairetinidigital.netlify.app</div>
</div>
</body>
</html>
